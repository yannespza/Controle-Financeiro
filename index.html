<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1F4E79">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Controle">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Meu Controle Financeiro</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* Conceito: caderno-razão no celular. Azul-tinta da planilha original, números em mono tabular,
   cores dos bancos iguais às da planilha. Uma tela por tarefa: Painel, Lançamentos, Ano, Mais, e a folha de lançar. */
:root{
  --bg:#F3F5F8; --surface:#FFFFFF; --surface-2:#E9EEF4; --ink:#122033; --ink-2:#4A5A6E; --line:#D9E0E8;
  --accent:#1F4E79; --accent-ink:#FFFFFF; --accent-soft:#DDEBF7;
  --neg:#B3261E; --pos:#1B7A3A; --warn-bg:#FFF2CC; --warn-ink:#7F6000; --future:#E3EEF9; --scrim:rgba(10,20,35,.45);
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s-out:#5f6670;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1621; --surface:#16212F; --surface-2:#1E2C3D; --ink:#E8EEF6; --ink-2:#9AA9BC; --line:#2A3A4E;
    --accent:#8CBFF0; --accent-ink:#0B1B2B; --accent-soft:#1C3350;
    --neg:#FF8E86; --pos:#6FD18C; --warn-bg:#3A3015; --warn-ink:#F3D27A; --future:#18304A; --scrim:rgba(0,0,0,.6);
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s-out:#9aa3ae;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1621; --surface:#16212F; --surface-2:#1E2C3D; --ink:#E8EEF6; --ink-2:#9AA9BC; --line:#2A3A4E;
  --accent:#8CBFF0; --accent-ink:#0B1B2B; --accent-soft:#1C3350;
  --neg:#FF8E86; --pos:#6FD18C; --warn-bg:#3A3015; --warn-ink:#F3D27A; --future:#18304A; --scrim:rgba(0,0,0,.6);
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s-out:#9aa3ae;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.4 var(--sans);padding-block:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:520px;margin:0 auto;min-height:100%}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;font-feature-settings:"zero" 0}
.neg{color:var(--neg)} .pos{color:var(--pos)} .muted{color:var(--ink-2)}
.cap{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}

/* topo */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:8px 0 6px}
.mrow{display:grid;grid-template-columns:44px 1fr 44px;align-items:center}
.mrow button.nav{height:44px;border:0;background:transparent;font-size:26px;line-height:1;color:var(--accent);border-radius:12px}
.mrow button.nav:active{background:var(--surface-2)}
.month{border:0;background:transparent;text-align:center;padding:2px 0}
.month b{display:block;font-size:19px;font-weight:700;letter-spacing:-.01em}
.month small{display:block;font-size:12px;color:var(--ink-2)}
.ttl{padding:10px 0 4px;font-size:19px;font-weight:700}
.ttl small{display:block;font-size:12px;font-weight:400;color:var(--ink-2)}

/* telas */
main{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
.view{display:none;flex-direction:column;gap:22px;padding-top:6px}
.view.on{display:flex}
.sec{display:flex;flex-direction:column;gap:8px;min-width:0}
.block{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.hero{background:var(--accent);color:var(--accent-ink);border-radius:18px;padding:18px 18px 16px;display:flex;flex-direction:column;gap:12px}
.hero .cap{color:inherit;opacity:.8}
.hero-v{font-size:32px;font-weight:600;letter-spacing:-.02em;line-height:1.1}
.hero-v small{font-size:15px;font-weight:500;opacity:.8;margin-right:4px}
.hero-g{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.hero-g div{min-width:0}
.hero-g span{display:block;font-size:11px;opacity:.8}
.hero-g b{font-size:14px;font-weight:600}

.acc{display:grid;grid-template-columns:6px 1fr auto;gap:12px;align-items:center;padding:11px 14px 11px 0;border-top:1px solid var(--line)}
.acc:first-child{border-top:0}
.acc .dot{align-self:stretch;background:var(--c)}
.acc b{font-weight:600}
.acc small{display:block;font-size:12px;color:var(--ink-2);margin-top:1px;font-variant-numeric:tabular-nums}
.acc .v{font-size:16px;font-weight:600}
.acc.tot{background:var(--surface-2)} .acc.tot .dot{background:var(--ink-2)}
.acc.res .dot{background:var(--accent)}

.trio{display:grid;grid-template-columns:repeat(3,1fr)}
.trio>div{padding:12px 14px;border-left:1px solid var(--line);min-width:0}
.trio>div:first-child{border-left:0}
.trio .cap{display:block;margin-bottom:4px}
.trio .num{font-size:16px;font-weight:600}
.trio small,.trio small.num{display:block;font-size:11px;font-weight:400;color:var(--ink-2);margin-top:2px}

.cat{padding:10px 14px 11px;border-top:1px solid var(--line)}
.cat:first-child{border-top:0}
.cat-top{display:grid;grid-template-columns:1fr auto 76px;gap:10px;align-items:baseline}
.cat-top span:first-child{font-weight:500;min-width:0;overflow-wrap:anywhere}
.cat-top .d{text-align:right;font-size:12px}
.bar{height:5px;border-radius:3px;background:var(--surface-2);margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px;background:var(--neg);opacity:.75}
.bar i.p{background:var(--pos)}
.note{font-size:12px;color:var(--ink-2)}

.kv{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 14px;border-top:1px solid var(--line);min-height:46px}
.kv:first-child{border-top:0}
.kv.strong{background:var(--surface-2);font-weight:600}
.kv input{width:112px;text-align:right;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--bg);font-size:16px}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.pill.ok{background:color-mix(in srgb,var(--pos) 16%,transparent);color:var(--pos)}
.pill.bad{background:color-mix(in srgb,var(--neg) 16%,transparent);color:var(--neg)}

/* lançamentos */
.tools{display:flex;flex-direction:column;gap:10px}
.search{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 14px;font-size:16px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;min-height:38px;padding:0 14px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font-size:14px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.chip i{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
.chip.acc[aria-pressed="true"]{background:var(--c);color:var(--on)}
.chip.acc[aria-pressed="true"] i{background:var(--on)}
.scroller{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.scroller::-webkit-scrollbar{display:none}
.scroller .chip{flex:none}
.day{display:flex;justify-content:space-between;align-items:baseline;padding:14px 2px 6px}
.day b{font-size:13px;font-weight:600}
.day.fut b{color:var(--accent)}
.list{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:6px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;background:var(--surface);border:0;border-top:1px solid var(--line);padding:10px 14px 10px 0;min-height:56px}
.row:first-child{border-top:0}
.row .bar6{align-self:stretch;background:var(--c)}
.row-main{min-width:0}
.row-main b{display:block;font-weight:500;overflow-wrap:anywhere}
.row-main small{display:block;font-size:12px;color:var(--ink-2)}
.row .v{font-size:15px;font-weight:600;white-space:nowrap}
.row.is-transf{color:var(--ink-2)} .row.is-transf b{font-style:italic;font-weight:400}
.row.is-transf .v{color:var(--ink-2);font-weight:500}
.row.is-future{background:var(--future)}
.group{border:1px solid var(--line);border-radius:14px;overflow:hidden}
.empty{padding:28px 16px;text-align:center;color:var(--ink-2);background:var(--surface);border:1px dashed var(--line);border-radius:14px}
.empty b{display:block;color:var(--ink);margin-bottom:4px}

/* ano */
.mo{display:grid;grid-template-columns:54px 1fr auto;gap:12px;align-items:center;width:100%;border:0;background:var(--surface);border-top:1px solid var(--line);padding:10px 14px;text-align:left}
.mo:first-child{border-top:0}
.mo.cur{background:var(--accent-soft)}
.mo.vazio b,.mo.vazio .r{opacity:.55}
.mo b{font-weight:600}
.mo .bars{display:flex;flex-direction:column;gap:3px;min-width:0}
.mo .bars i{display:block;height:6px;border-radius:3px}
.mo .bars i.e{background:var(--pos)} .mo .bars i.s{background:var(--neg);opacity:.8}
.mo .r{text-align:right;font-size:13px}
.mo .r small{display:block;font-size:11px;color:var(--ink-2)}

/* mais */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600;padding:0 16px;width:100%}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.danger{color:var(--neg)}
.swatch{display:inline-block;width:12px;height:12px;border-radius:3px;background:var(--c);margin-right:8px;vertical-align:-1px}

/* navegação */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tabs-in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 64px 1fr 1fr 1fr;align-items:center}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:transparent;color:var(--ink-2);font-size:10.5px;font-weight:500;min-height:50px;border-radius:12px;padding:0;min-width:0}
.tab svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{color:var(--accent);font-weight:600}
.add{justify-self:center;width:56px;height:56px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;margin-top:-22px;box-shadow:0 6px 16px rgba(10,30,60,.28)}
.add svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round}

/* folha de lançar */
.sheet{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.scrim{position:absolute;inset:0;background:var(--scrim)}
.panel{position:relative;width:100%;max-width:520px;max-height:94%;overflow-y:auto;overscroll-behavior:contain;background:var(--bg);
  border-radius:20px 20px 0 0;padding:10px max(16px,env(safe-area-inset-left,0px)) 0 max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto}
.sh-head{display:flex;justify-content:space-between;align-items:center}
.sh-head h2{margin:0;font-size:18px}
.x{width:40px;height:40px;border:0;border-radius:50%;background:var(--surface-2);font-size:22px;line-height:1}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface-2);border-radius:12px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;border-radius:9px;min-height:40px;font-weight:600;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.seg button[data-mode="saiu"][aria-pressed="true"]{color:var(--neg)}
.seg button[data-mode="entrou"][aria-pressed="true"]{color:var(--pos)}
.fld{display:flex;flex-direction:column;gap:8px;min-width:0}
.fld>span,.fld>summary{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.fld input[type=text],.fld input[type=date],.fld textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;font-size:16px;min-height:48px}
.amt{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px 16px}
.amt b{font-size:18px;color:var(--ink-2)}
.fld .amt input[type=text]{border:0;background:transparent;width:100%;font:600 30px var(--mono);padding:6px 0;min-width:0;min-height:0;border-radius:0;outline:none}
.amt:focus-within{outline:2px solid var(--accent)}
.dates{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.dates .chip{min-height:44px;padding:0 12px}
.dates input{flex:1 1 150px;min-width:0}
.hint{font-size:12px;color:var(--ink-2)}
.hint.fut{color:var(--accent);font-weight:600}
.err{margin:0;padding:10px 12px;border-radius:10px;background:color-mix(in srgb,var(--neg) 14%,transparent);color:var(--neg);font-weight:500}
.actions{position:sticky;bottom:0;background:var(--bg);padding:10px 0 calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:8px}
.actions .btn{flex:1;min-width:0;padding:0 10px}
.actions .btn.primary{flex:1.3}
.toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:30;background:var(--ink);color:var(--bg);
  padding:11px 16px;border-radius:12px;font-weight:500;display:flex;gap:14px;align-items:center;max-width:calc(100% - 32px);box-shadow:0 8px 24px rgba(0,0,0,.3)}
.toast button{border:0;background:transparent;color:var(--accent-soft);font-weight:700;padding:0}
:root[data-theme="dark"] .toast button,:root:not([data-theme="light"]) .toast button{color:var(--accent)}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]) .toast button{color:#9CCBF5}}
.banner{padding:10px 12px;border-radius:12px;background:var(--warn-bg);color:var(--warn-ink);font-size:13px}
@media (max-width:340px){.tab{font-size:9.5px}}
@media (prefers-reduced-motion:no-preference){
  .panel{animation:up .22s ease-out} .scrim{animation:fade .22s ease-out}
  @keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
  @keyframes fade{from{opacity:0}to{opacity:1}}
}
/* gráficos do mês */
.chart{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 12px 8px}
.chart h3{margin:0 0 2px;font-size:14px;font-weight:600}
.chart .sub{font-size:12px;color:var(--ink-2);margin:0 0 8px}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart svg text{font:10px var(--sans);fill:var(--ink-2)}
.chart svg .grid{stroke:var(--line);stroke-width:1}
.chart svg .base{stroke:var(--ink-2);stroke-width:1;opacity:.6}
.chart svg [data-tip]{cursor:pointer}
.chart svg .hit{fill:transparent}
.chart svg .sel text.ml{font-weight:700;fill:var(--ink)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--ink-2);margin:0 0 6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--c);margin-right:6px;vertical-align:-1px}
.stack{display:flex;gap:2px;height:16px;border-radius:5px;overflow:hidden;margin:4px 0 10px}
.stack span{display:block;height:100%;background:var(--c);min-width:3px}
.comp{display:grid;grid-template-columns:12px 1fr auto 44px;gap:6px 10px;align-items:center;font-size:13px}
.comp i{width:12px;height:12px;border-radius:3px;background:var(--c)}
.comp .n{min-width:0;overflow-wrap:anywhere}
.comp .p{text-align:right;color:var(--ink-2);font-size:12px}
.tip{position:fixed;z-index:40;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;font-weight:500;padding:6px 9px;border-radius:8px;white-space:nowrap;transform:translate(-50%,-100%);box-shadow:0 4px 14px rgba(0,0,0,.25)}
/* backup */
.dl{display:grid;grid-template-columns:40px 1fr;gap:4px 12px;align-items:center;text-align:left;justify-content:start;padding:12px 14px;min-height:64px}
.dl b{display:block;font-weight:600}
.dl small{display:block;font-weight:400;font-size:12px;color:var(--ink-2)}
.dl .ico{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font:700 11px var(--mono)}
/* configuração (primeira vez e edição) */
.acct{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.acct-top{display:grid;grid-template-columns:minmax(0,1fr) 104px;gap:10px;align-items:center}
.acct input[type=text]{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;font-size:16px;min-height:46px;min-width:0}
.acct input.num{text-align:right}
.acct .lock{font-weight:600;min-height:46px;display:flex;align-items:center;min-width:0;overflow-wrap:anywhere}
.sw{display:flex;flex-wrap:wrap;gap:8px}
.sw button{width:30px;height:30px;border-radius:50%;border:2px solid transparent;background:var(--c);padding:0;box-shadow:inset 0 0 0 1px rgba(0,0,0,.18)}
.sw button[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 2px var(--bg)}
.acct-foot{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip.sm{min-height:36px;padding:0 12px;font-size:13px}
.chip.ghost{border-style:dashed;background:transparent}
.rm{margin-left:auto;border:0;background:transparent;color:var(--neg);font-weight:600;min-height:36px;padding:0 6px}
.rm:disabled{color:var(--ink-2);opacity:.5}
.addrow{display:flex;gap:8px}
.addrow input{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;font-size:16px;min-height:46px}
.addrow .btn{width:auto;min-height:46px;flex:none}
.welcome{background:var(--accent-soft);border-radius:16px;padding:16px}
.welcome b{display:block;font-size:17px;margin-bottom:4px}
.welcome p{margin:0;font-size:14px;color:var(--ink-2)}
.chip[aria-disabled="true"]{opacity:.75}
html,body{margin:0}
</style>

<script src="instalar.js" data-cor="#1F4E79" defer></script>
</head>
<body>
<div class="wrap">
  <header class="top" id="top"></header>
  <main>
    <section class="view" id="v-painel" aria-label="Painel"></section>
    <section class="view" id="v-lista" aria-label="Lançamentos">
      <div class="tools">
        <input class="search" id="q" type="search" placeholder="Buscar em todos os meses" aria-label="Buscar lançamentos" autocomplete="off">
        <div class="scroller" id="accChips"></div>
      </div>
      <div id="listBody"></div>
    </section>
    <section class="view" id="v-contas" aria-label="Contas"></section>
    <section class="view" id="v-ano" aria-label="Ano"></section>
    <section class="view" id="v-mais" aria-label="Mais"></section>
    <section class="view" id="v-setup" aria-label="Configuração"></section>
  </main>
</div>

<nav class="tabs" aria-label="Seções"><div class="tabs-in">

<script>
(function(){
"use strict";
var TRANSF="Transferência", CARTAO="Cartão Crédito";
function cartaoHTML(c){
  var cfg=state.cfg, nomes=cfg.uberNomes; if(!nomes||!nomes.length)return "";
  var row=c.rows.filter(function(r){return r.nome===CARTAO;})[0], fatura=-(row?row.cur:0);
  var u=((cfg.uber||{})[c.key]||[]), sem=fatura;
  var h='<div class="sec"><span class="cap">Cartão de crédito</span><div class="block"><div class="kv"><span>Fatura do cartão</span><b class="num">'+money(fatura)+'</b></div>';
  nomes.forEach(function(n,i){var v=Number(u[i])||0;sem-=v;
    h+='<div class="kv"><label for="u'+i+'">'+esc(n)+'</label><input id="u'+i+'" class="num" inputmode="decimal" value="'+(v?nf.format(v):'')+'" placeholder="0,00" data-uber="'+i+'"></div>';});
  return h+'<div class="kv strong"><span>Fatura sem Uber</span><b class="num">'+money(sem)+'</b></div></div></div>';
}
var MESES=["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
var AB=["Jan","Fev","Mar","Abr","Mai","Jun","Jul","Ago","Set","Out","Nov","Dez"];
var DIAS=["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"];
var $=function(s,r){return (r||document).querySelector(s);};
var $$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s));};
var esc=function(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});};
var pad=function(n){return String(n).padStart(2,"0");};
var iso=function(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());};
var today=function(){return iso(new Date());};
var parseISO=function(s){var p=s.split("-").map(Number);return new Date(p[0],p[1]-1,p[2]);};
var addDays=function(s,n){var d=parseISO(s);d.setDate(d.getDate()+n);return iso(d);};
var monthKey=function(s){return s.slice(0,7);};
var monthStart=function(k){return k+"-01";};
var monthEnd=function(k){var p=k.split("-").map(Number);return k+"-"+pad(new Date(p[0],p[1],0).getDate());};
var addMonths=function(k,n){var p=k.split("-").map(Number);var d=new Date(p[0],p[1]-1+n,1);return d.getFullYear()+"-"+pad(d.getMonth()+1);};
var maxS=function(a,b){return a>b?a:b;}, minS=function(a,b){return a<b?a:b;};
var r2=function(v){return Math.round((v+Number.EPSILON)*100)/100;};
var nf=new Intl.NumberFormat("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});
var money=function(v){v=r2(v||0);return Math.abs(v)<0.005?"–":nf.format(v);};
var moneyS=function(v){v=r2(v||0);return Math.abs(v)<0.005?"–":(v>0?"+":"")+nf.format(v);};
var fdm=function(s){return s.slice(8,10)+"/"+s.slice(5,7);};
var fdmy=function(s){return s.slice(8,10)+"/"+s.slice(5,7)+"/"+s.slice(0,4);};
var labelMes=function(k){var p=k.split("-").map(Number);return AB[p[1]-1]+"/"+String(p[0]).slice(2);};
var longMes=function(k){var p=k.split("-").map(Number);return MESES[p[1]-1]+" "+p[0];};
var dowOf=function(s){return DIAS[parseISO(s).getDay()];};
function lum(h){var c=[1,3,5].map(function(i){var v=parseInt(h.substr(i,2),16)/255;return v<=0.03928?v/12.92:Math.pow((v+0.055)/1.055,2.4);});return .2126*c[0]+.7152*c[1]+.0722*c[2];}
var onColor=function(h){return lum(h)<0.18?"#FFFFFF":"#111111";};

/* ---------- regras de cálculo (as mesmas da planilha) ---------- */
var descTransf=function(t){return /transfer.ncia interna/i.test(t.desc||"");};
var isTransf=function(t){return t.cat===TRANSF||descTransf(t);};
var net=function(t){return (t.cred||0)-(t.deb||0);};
function eff(tx,cfg){var i0=(cfg&&cfg.inicio)||"";return i0?tx.filter(function(t){return t.date>=i0;}):tx;}
function calcMonth(tx,cfg,key,td){
  tx=eff(tx,cfg);
  var start=monthStart(key), end=monthEnd(key), before=addDays(start,-1);
  var ref=maxS(before,minS(td,end)), pStart=monthStart(addMonths(key,-1));
  var inR=function(t,a,b){return t.date>=a&&t.date<=b;};
  var contas=(cfg.contas||[]).filter(function(c){return c&&c.nome;});
  var sums={};contas.forEach(function(c){var v=Number(c.saldo)||0;sums[c.nome]={ini:v,atual:v,proj:v};});
  for(var i=0;i<tx.length;i++){var t=tx[i],sm=sums[t.conta];if(!sm||t.date>end)continue;var v=net(t);sm.proj+=v;if(t.date<=ref)sm.atual+=v;if(t.date<=before)sm.ini+=v;}
  var acc=contas.map(function(c){var sm=sums[c.nome];return {nome:c.nome,cor:c.cor,reserva:!!c.reserva,ini:sm.ini,atual:sm.atual,proj:sm.proj};});
  var sumA=function(f,only){return acc.reduce(function(s,a){return s+((only&&!a.reserva)?0:a[f]);},0);};
  var pad=acc.filter(function(a){return a.nome===cfg.padrao;})[0]||acc[0]||{nome:"",ini:0,atual:0,proj:0};
  var tot={ini:sumA("ini"),atual:sumA("atual"),proj:sumA("proj")};
  var res={ini:sumA("ini",1),atual:sumA("atual",1),proj:sumA("proj",1)};
  var nt=tx.filter(function(t){return !isTransf(t);});
  var flow=function(a,b){var cr=0,de=0;nt.forEach(function(t){if(inR(t,a,b)){cr+=t.cred||0;de+=t.deb||0;}});return {cred:cr,deb:de,bal:cr-de};};
  var proj=flow(start,end), atual=flow(start,ref);
  var cats=(cfg.cats||[]).filter(function(c){return c&&c.nome;});
  var catNet=function(nome,a,b){var s=0;tx.forEach(function(t){if(!inR(t,a,b)||t.cat!==nome)return;if(nome!==TRANSF&&descTransf(t))return;s+=net(t);});return s;};
  var rows=cats.map(function(c){var cur=catNet(c.nome,start,end),prev=catNet(c.nome,pStart,before);return {nome:c.nome,peso:Number(c.peso)||0,cur:cur,prev:prev,delta:cur-prev};});
  var real=rows.filter(function(r){return r.nome!==TRANSF;});
  var sum=function(arr,f){return arr.reduce(function(s,r){return s+r[f];},0);};
  var outCur=r2(proj.bal-sum(real,"cur")), outPrev=r2(flow(pStart,before).bal-sum(real,"prev"));
  var dispCur=real.reduce(function(s,r){return s+r.peso*r.cur;},0), dispPrev=real.reduce(function(s,r){return s+r.peso*r.prev;},0);
  var trSum=0;tx.forEach(function(t){if(isTransf(t))trSum+=net(t);});
  return {key:key,start:start,end:end,ref:ref,acc:acc,pad:pad,tot:tot,res:res,proj:proj,atual:atual,rows:rows,out:{cur:outCur,prev:outPrev},
    disp:{cur:dispCur,prev:dispPrev,eco:dispCur-dispPrev},
    chk:{saldos:r2((tot.proj-tot.ini)-proj.bal),transf:r2(trSum)}};
}
function calcAno(tx,cfg){
  tx=eff(tx,cfg);
  var first=monthKey(cfg.inicio||"2026-07-01"), out=[];
  var base=(cfg.contas||[]).reduce(function(s,c){return s+(Number(c.saldo)||0);},0);
  for(var k=0;k<18;k++){
    var key=addMonths(first,k), a=monthStart(key), b=monthEnd(key), cr=0,de=0,cum=base;
    tx.forEach(function(t){
      if(t.date<=b)cum+=net(t);
      if(!isTransf(t)&&t.date>=a&&t.date<=b){cr+=t.cred||0;de+=t.deb||0;}
    });
    out.push({key:key,cred:cr,deb:de,bal:cr-de,fim:cum});
  }
  return out;
}
window.__calcMonth=calcMonth; window.__calcAno=calcAno;

/* ---------- estado ---------- */
var state={tx:[],cfg:null,txLoaded:false,cfgLoaded:false,offline:false,slow:false,view:"painel",month:monthKey(today()),q:"",acc:"",setup:null};
var VIEWS={painel:"painel",lancamentos:"lista",contas:"contas",ano:"ano",mais:"mais"};
var NAMES={};Object.keys(VIEWS).forEach(function(k){NAMES[VIEWS[k]]=k;});

function accColor(nome){var c=((state.cfg&&state.cfg.contas)||[]).filter(function(a){return a.nome===nome;})[0];return (c&&c.cor)||"#8A97A8";}
function ready(){return state.txLoaded&&state.cfgLoaded&&state.cfg;}

/* ---------- desenho ---------- */
var raf=0;
function render(){if(raf)return;raf=requestAnimationFrame(function(){raf=0;draw();});}
function draw(){
  if(state.view==="setup"&&state.cfg&&(!state.setup||state.setup.isNew)){state.setup=null;state.view="painel";}
  if(!state.cfg&&state.view!=="setup"){state.setup=newDraft(null);state.view="setup";}
  $(".tabs").hidden=(state.view==="setup");
  $$(".tab").forEach(function(b){var on=VIEWS[b.dataset.go]===state.view;if(on)b.setAttribute("aria-current","page");else b.removeAttribute("aria-current");});
  $$(".view").forEach(function(v){v.classList.toggle("on",v.id==="v-"+state.view);});
  drawTop();
  if(state.view==="setup"){drawSetup();return;}
  if(!ready()){
    var msg=state.slow?"Ainda não consegui alcançar os dados. Verifique a internet.":"Carregando seus lançamentos…";
    $("#v-"+state.view).innerHTML='<div class="empty"><b>'+msg+'</b></div>';return;
  }
  if(state.view==="painel")drawPainel();
  else if(state.view==="lista")drawLista();
  else if(state.view==="contas")drawContas();
  else if(state.view==="ano")drawAno();
  else drawMais();
}
function drawTop(){
  var el=$("#top"), cur=monthKey(today());
  if(state.view==="painel"||state.view==="lista"||state.view==="contas"){
    el.innerHTML='<div class="mrow"><button class="nav" data-m="-1" aria-label="Mês anterior">‹</button>'+
      '<button class="month" data-m="0" aria-label="Voltar ao mês atual"><b>'+esc(longMes(state.month))+'</b><small>'+(state.month===cur?"mês atual":(state.month<cur?"toque para voltar a hoje":"toque para voltar a hoje"))+'</small></button>'+
      '<button class="nav" data-m="1" aria-label="Próximo mês">›</button></div>';
  }else{
    var T=state.view==="ano"?"Visão do ano<small>Entradas e saídas sem transferências entre contas</small>":(state.view==="setup"?(state.setup&&state.setup.isNew?"Vamos configurar<small>Leva uns 2 minutos</small>":"Contas e categorias<small>Ajuste quando precisar</small>"):"Backup<small>Baixe seus dados e veja contas e categorias</small>");
    el.innerHTML='<div class="ttl">'+T+'</div>';
  }
}
function accBlock(c,withTotal){
  var h='<div class="sec"><span class="cap">Contas</span><div class="block">';
  c.acc.forEach(function(a){
    h+='<div class="acc" style="--c:'+esc(a.cor||"#8A97A8")+'"><span class="dot"></span><div><b>'+esc(a.nome)+'</b>'+
       '<small>início '+money(a.ini)+' · projetado '+money(a.proj)+'</small></div>'+
       '<span class="v num'+(a.atual<-0.005?' neg':'')+'">'+money(a.atual)+'</span></div>';
  });
  if(withTotal)h+='<div class="acc tot"><span class="dot"></span><div><b>Total geral</b><small>início '+money(c.tot.ini)+' · projetado '+money(c.tot.proj)+'</small></div><span class="v num">'+money(c.tot.atual)+'</span></div>';
  h+='<div class="acc res"><span class="dot"></span><div><b>Reserva</b><small>contas marcadas como reserva</small></div><span class="v num">'+money(c.res.atual)+'</span></div>';
  return h+'</div></div>';
}
function drawContas(){
  var c=calcMonth(state.tx,state.cfg,state.month,today());
  var h='<div class="hero"><div><span class="cap">Total de todas as contas · até '+fdm(c.ref)+'</span>'+
     '<div class="hero-v num"><small>R$</small>'+nf.format(r2(c.tot.atual))+'</div></div>'+
     '<div class="hero-g"><div><span>Início do mês</span><b class="num">'+money(c.tot.ini)+'</b></div>'+
     '<div><span>Projetado no fim</span><b class="num">'+money(c.tot.proj)+'</b></div>'+
     '<div><span>Reserva agora</span><b class="num">'+money(c.res.atual)+'</b></div></div></div>';
  h+=accBlock(c,true);
  h+='<span class="note">Soma de todas as suas contas. O saldo do topo do Painel é só o da conta padrão.</span>';
  $("#v-contas").innerHTML=h;
}
function chartsHTML(c){
  var key=c.key, td=today(), nt=state.tx.filter(function(t){return !isTransf(t);});
  var h='<div class="sec"><span class="cap">Gráficos do mês</span>';
  // 1) gastos dia a dia
  var n=Number(c.end.slice(8,10)), days=[], mx=0, tot=0, totHoje=0;
  for(var d=1;d<=n;d++)days.push(0);
  nt.forEach(function(t){if(t.deb&&monthKey(t.date)===key){var i=Number(t.date.slice(8,10))-1;days[i]+=t.deb;tot+=t.deb;if(t.date<=td)totHoje+=t.deb;}});
  days.forEach(function(v){mx=Math.max(mx,v);});
  var passados=Math.max(1,Math.min(n,Math.round((parseISO(minS(td,c.end))-parseISO(c.start))/864e5)+1));
  var W=340,H=150,L=34,R=4,T=8,B=20,pw=W-L-R,ph=H-T-B,step=pw/n,bw=Math.max(3,Math.min(9,step-2.5));
  var top=niceMax(mx), y=function(v){return T+ph-(v/top)*ph;};
  var s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Gastos por dia em '+esc(longMes(key))+'">';
  [0,.5,1].forEach(function(f){var v=top*f,yy=y(v).toFixed(1);s+='<line class="grid" x1="'+L+'" x2="'+(W-R)+'" y1="'+yy+'" y2="'+yy+'"/><text x="'+(L-5)+'" y="'+(Number(yy)+3)+'" text-anchor="end">'+kfmt(v)+'</text>';});
  days.forEach(function(v,i){
    var x=L+i*step+(step-bw)/2, dstr=key+"-"+pad(i+1), fut=dstr>td, hh=v?Math.max(2,(v/top)*ph):0;
    var tip=dowOf(dstr)+', '+fdm(dstr)+' · '+(v?'R$ '+nf.format(r2(v)):'sem gastos')+(fut&&v?' (previsto)':'');
    if(hh)s+='<path d="'+barPath(x,T+ph,bw,hh)+'" fill="var(--accent)"'+(fut?' opacity=".35"':'')+'/>';
    s+='<rect class="hit" x="'+(L+i*step)+'" y="'+T+'" width="'+step+'" height="'+ph+'" data-tip="'+esc(tip)+'"/>';
    if(i===0||(i+1)%5===0)s+='<text x="'+(L+i*step+step/2)+'" y="'+(H-6)+'" text-anchor="middle">'+(i+1)+'</text>';
  });
  s+='<line class="base" x1="'+L+'" x2="'+(W-R)+'" y1="'+(T+ph)+'" y2="'+(T+ph)+'"/></svg>';
  h+='<div class="chart"><h3>Gastos dia a dia</h3><p class="sub">'+(tot?'Total '+money(tot)+' · média de '+money(totHoje/passados)+' por dia até hoje'+(tot>totHoje?' · claro = previsto':''):'Sem gastos neste mês')+'</p>'+s+'</div>';
  // 2) para onde foi o dinheiro
  var bc={},soma=0;
  nt.forEach(function(t){if(t.deb&&monthKey(t.date)===key){var k=t.cat||"Sem categoria";bc[k]=(bc[k]||0)+t.deb;soma+=t.deb;}});
  var arr=Object.keys(bc).map(function(k){return {n:k,v:bc[k]};}).sort(function(a,b){return b.v-a.v;});
  if(arr.length>6){var resto=arr.slice(5).reduce(function(a,x){return a+x.v;},0);arr=arr.slice(0,5).concat([{n:"Outras categorias",v:resto,o:1}]);}
  var cols=["var(--s1)","var(--s2)","var(--s3)","var(--s4)","var(--s5)"];
  arr.forEach(function(x,i){x.c=x.o?"var(--s-out)":cols[i];});
  if(soma){
    h+='<div class="chart"><h3>Para onde foi o dinheiro</h3><p class="sub">Saídas do mês por categoria, sem transferências</p>'+
       '<div class="stack" role="img" aria-label="Divisão das saídas por categoria">'+arr.map(function(x){return '<span style="--c:'+x.c+';flex:'+x.v+'" data-tip="'+esc(x.n+' · R$ '+nf.format(r2(x.v))+' · '+Math.round(x.v/soma*100)+'%')+'"></span>';}).join("")+'</div>'+
       '<div class="comp">'+arr.map(function(x){return '<i style="--c:'+x.c+'"></i><span class="n">'+esc(x.n)+'</span><span class="num">'+money(x.v)+'</span><span class="p">'+Math.round(x.v/soma*100)+'%</span>';}).join("")+'</div></div>';
  }
  // 3) últimos 6 meses
  var ms=[];for(var k=-5;k<=0;k++){var mk=addMonths(key,k),cr=0,de=0;nt.forEach(function(t){if(monthKey(t.date)===mk){cr+=t.cred||0;de+=t.deb||0;}});ms.push({k:mk,cr:cr,de:de});}
  var m2=0;ms.forEach(function(m){m2=Math.max(m2,m.cr,m.de);});
  var top2=niceMax(m2), H2=160, ph2=H2-T-B, y2=function(v){return T+ph2-(v/top2)*ph2;}, gw=pw/6, b2=Math.min(14,(gw-10)/2);
  var s2='<svg viewBox="0 0 '+W+' '+H2+'" role="img" aria-label="Entradas e saídas dos últimos 6 meses">';
  [0,.5,1].forEach(function(f){var v=top2*f,yy=y2(v).toFixed(1);s2+='<line class="grid" x1="'+L+'" x2="'+(W-R)+'" y1="'+yy+'" y2="'+yy+'"/><text x="'+(L-5)+'" y="'+(Number(yy)+3)+'" text-anchor="end">'+kfmt(v)+'</text>';});
  ms.forEach(function(m,i){
    var cx=L+i*gw+gw/2, p=m.k.split("-").map(Number), lab=AB[p[1]-1]+'/'+String(p[0]).slice(2), sel=m.k===key;
    s2+='<g'+(sel?' class="sel"':'')+'>';
    if(m.cr)s2+='<path d="'+barPath(cx-b2-1,T+ph2,b2,Math.max(2,(m.cr/top2)*ph2))+'" fill="var(--s1)"/>';

  if(cfg){
    cfg.contas.forEach(function(a){d.contas.push({nome:a.nome,saldo:fmtIn(a.saldo),cor:a.cor||PALETA[0],reserva:!!a.reserva,padrao:a.nome===cfg.padrao,locked:!!u.a[a.nome]});});
    var seen={};

    CATS_SUG.forEach(function(n){if(!seen[n])d.cats.push({nome:n,on:false,peso:0,locked:false});});

function setupAct(act,b){
  var d=state.setup;if(!d)return;
  var i=b?Number(b.dataset.i):-1, v=b?b.dataset.v:"";
  d.err="";
  if(act==="cor")d.contas[i].cor=v;
  else if(act==="padrao")d.contas.forEach(function(a,k){a.padrao=(k===i);});
  else if(act==="reserva")d.contas[i].reserva=!d.contas[i].reserva;
  else if(act==="rm"){var rem=d.contas.splice(i,1)[0];if(rem&&rem.padrao&&d.contas.length)d.contas[0].padrao=true;}
  else if(act==="addconta"){d.contas.push({nome:v,saldo:"",cor:nextColor(d.contas),reserva:false,padrao:!d.contas.length,locked:false});d.focus={i:d.contas.length-1,k:v?"saldo":"nome"};}
  else if(act==="cat"){var c=d.cats[i];if(c.locked){toast("Esta categoria já tem lançamentos");return;}c.on=!c.on;if(!c.on)c.peso=0;}
  else if(act==="peso"){d.cats[i].peso=d.cats[i].peso>0?0:1;}
  else if(act==="addcat"){
    var n=(d.novaCat||"").trim().replace(/\s+/g," ");if(!n)return;
    if(n.toLowerCase()===TRANSF.toLowerCase())d.err="Esse nome é reservado para as transferências.";
    else{var ex=d.cats.filter(function(c){return c.nome.toLowerCase()===n.toLowerCase();})[0];if(ex)ex.on=true;else d.cats.push({nome:n,on:true,peso:0,locked:false});d.novaCat="";}
  }
  else if(act==="restorar"){$("#restoreFile").click();return;}
  else if(act==="cancel"){state.setup=null;go("painel");return;}
  else if(act==="salvar"){saveSetup();return;}
  render();
}

  var cs=d.contas.map(function(a){return {raw:String(a.saldo||"").trim(),nome:String(a.nome||"").trim().replace(/\s+/g," "),saldo:parseMoney(a.saldo),cor:a.cor,reserva:!!a.reserva,padrao:!!a.padrao};});
  if(!cs.length)err="Adicione pelo menos uma conta.";
  else if(cs.some(function(a){return !a.nome;}))err="Dê um nome para cada conta.";
  else if(cs.some(function(a){return a.raw&&!/\d/.test(a.raw);}))err="Confira os saldos: use só números, como 1.250,40.";
  else{var seen={};cs.forEach(function(a){var k=a.nome.toLowerCase();if(seen[k]&&!err)err="Há duas contas com o nome “"+a.nome+"”.";seen[k]=1;});}
  if(!err&&!/^\d{4}-\d{2}-\d{2}$/.test(d.inicio||""))err="Escolha a data de início.";
  var cats=d.cats.filter(function(c){return c.on;});
  if(!err&&!cats.length)err="Escolha pelo menos uma categoria.";
  if(err){d.err=err;render();return;}
  var pad=cs.filter(function(a){return a.padrao;})[0]||cs[0];
  var cfg=Object.assign({},state.cfg&&!d.isNew?state.cfg:{},{contas:cs.map(function(a){return {nome:a.nome,saldo:a.saldo,cor:a.cor,reserva:a.reserva};}),padrao:pad.nome,
    cats:cats.map(function(c){return {nome:c.nome,peso:c.peso>0?c.peso:0};}).concat([{nome:TRANSF,peso:0}]),inicio:d.inicio});
  var wasNew=d.isNew;
  putCfg(cfg).then(function(){
    state.setup=null;
    if(state.month<monthKey(cfg.inicio))state.month=monthKey(cfg.inicio);
    go("painel");
    toast(wasNew?"Tudo pronto! Toque no + para o primeiro lançamento":"Alterações salvas");
  });
}
(function(){
  var box=$("#v-setup");
  var onIn=function(e){
    var d=state.setup,el=e.target;if(!d)return;
    if(el.dataset&&el.dataset.k){var a=d.contas[Number(el.dataset.i)];if(a)a[el.dataset.k]=el.value;}
    else if(el.id==="s-novacat")d.novaCat=el.value;
    else if(el.id==="s-inicio")d.inicio=el.value;
  };
  box.addEventListener("input",onIn);box.addEventListener("change",onIn);
  box.addEventListener("keydown",function(e){if(e.key==="Enter"&&e.target.id==="s-novacat"){e.preventDefault();setupAct("addcat",null);}});
  box.addEventListener("click",function(e){var b=e.target.closest("[data-act]");if(b)setupAct(b.dataset.act,b);});
})();

/* ---------- armazenamento local: fica só neste aparelho ---------- */
var LS_KEY="cf_clean_v1", persisted=true, mem={cfg:null,tx:{}};
function lsProbe(){try{var k="cf_probe";localStorage.setItem(k,"1");localStorage.removeItem(k);return true;}catch(e){return false;}}
function lsRead(){try{var r=localStorage.getItem(LS_KEY);return r?JSON.parse(r):null;}catch(e){return null;}}
function lsWrite(){try{localStorage.setItem(LS_KEY,JSON.stringify(mem));return true;}catch(e){return false;}}
function syncState(){
  state.tx=Object.keys(mem.tx).map(function(id){var o=Object.assign({},mem.tx[id]);o.id=id;return o;}).filter(function(t){return t.date;});
  state.cfg=mem.cfg||null;state.txLoaded=true;state.cfgLoaded=true;
}
function commit(){if(!lsWrite())persisted=false;syncState();render();}
function putTx(id,rec){mem.tx[id]=JSON.parse(JSON.stringify(rec));commit();return Promise.resolve();}
function delTx(id){delete mem.tx[id];commit();return Promise.resolve();}
function putCfg(cfg){mem.cfg=JSON.parse(JSON.stringify(cfg));commit();return Promise.resolve();}
function replaceAll(next,msg){
  var snap=JSON.stringify(mem);mem=next;state.setup=null;commit();
  toast(msg,{label:"Desfazer",fn:function(){mem=JSON.parse(snap);commit();toast("Desfeito");}});
}
function armReset(b){
  if(b.dataset.armed!=="1"){b.dataset.armed="1";b.textContent="Toque de novo para apagar tudo";setTimeout(function(){if(b.dataset.armed==="1"){b.dataset.armed="";b.textContent="Apagar tudo e recomeçar";}},4000);return;}
  replaceAll({cfg:null,tx:{}},"Tudo apagado");
}
function localSave(r){return new Promise(function(res,rej){try{
  var tipo=/\.json$/i.test(r.filename)?"application/json":(/\.xlsx$/i.test(r.filename)?"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet":"text/csv;charset=utf-8");
  var u=URL.createObjectURL(new Blob([r.data],{type:tipo})),a=document.createElement("a");
  a.href=u;a.download=r.filename;document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(u);a.remove();},4000);res({status:"saved"});
}catch(e){rej(e);}});}
function dlUse(){return Promise.resolve({save:localSave});}
function backupJSON(){
  var data=JSON.stringify({app:"meu-controle-financeiro",versao:1,exportado:new Date().toISOString(),cfg:mem.cfg,tx:mem.tx});
  dlUse().then(function(d){
    if(!d){toast("Download indisponível aqui");return null;}
    return d.save({filename:"controle-financeiro-copia-"+today()+".json",data:data}).then(function(){toast("Cópia salva");});
  }).catch(function(e){if(!e||e.code!=="declined")toast("Não consegui baixar o arquivo");});
}
function restoreFrom(file){
  var rd=new FileReader();
  rd.onload=function(){
    var o;try{o=JSON.parse(String(rd.result).replace(/^\uFEFF/,"").trim());}catch(e){toast("Esse arquivo não é uma cópia de segurança do app");return;}
    if(o&&Array.isArray(o.tx)){var m={};o.tx.forEach(function(t,i){if(t&&t.date){var c=Object.assign({},t),id=c.id||("r"+i);delete c.id;m[id]=c;}});o.tx=m;}
    if(!o||!/controle-financeiro/.test(o.app||"")||!o.cfg||!Array.isArray(o.cfg.contas)||!o.tx||typeof o.tx!=="object"){toast("Este arquivo não é uma cópia deste app");return;}
    replaceAll({cfg:o.cfg,tx:o.tx},"Cópia restaurada: "+Object.keys(o.tx).length+" lançamentos");
  };
  rd.onerror=function(){toast("Não consegui ler o arquivo");};
  rd.readAsText(file);
}
$("#restoreFile").addEventListener("change",function(e){var f=e.target.files&&e.target.files[0];if(f)restoreFrom(f);e.target.value="";});

function start(){
  var h=VIEWS[location.hash.slice(1)];if(h)state.view=h;
  persisted=lsProbe();
  var m=lsRead();
  if(m&&m.tx&&typeof m.tx==="object")mem={cfg:m.cfg||null,tx:m.tx};
  syncState();render();
  window.addEventListener("storage",function(e){if(e.key===LS_KEY){var m2=lsRead();mem=(m2&&m2.tx)?{cfg:m2.cfg||null,tx:m2.tx}:{cfg:null,tx:{}};syncState();render();}});
}
start();
})();

if("serviceWorker" in navigator&&/^https?:$/.test(location.protocol)){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){});});}
</script>
